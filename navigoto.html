<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NaviSuite • Navigoto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&family=Manrope:wght@600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/navi-shared.css">
  <link rel="stylesheet" href="assets/css/navi-layout.css">
  <link rel="stylesheet" href="assets/css/shared-menu.css?v=3">
  <style>
    :root {
      --bg: #070e17;
      --panel: #0d1a29;
      --card: #112338;
      --line: #1c3852;
      --ink: #f0fdf4;
      --muted: #8ea8be;
      --accent: #2dd4bf;
      --yellow: #facc15;
      --gold: #f59e0b;
      --red: #fb7185;
      --green: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(1000px 500px at 50% -10%, #0c2b42, transparent 70%), var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', Manrope, system-ui, sans-serif;
      min-height: 100vh;
      position: relative;
    }

    /* PULSANTE HAMBURGER MENU NAVISUITE */
    #navigoto-menu-btn {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: 14px;
      z-index: 9999;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid #2dd4bf;
      border-radius: 13px;
      background: #103a3d;
      color: #a7fff0;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: all 0.2s;
    }
    #navigoto-menu-btn:hover {
      background: #175458;
      transform: scale(1.05);
    }

    main {
      margin-left: 230px;
      padding: 30px;
      max-width: 1100px;
    }

    /* STAGE DELLA STATUA CON LOGO E SCRITTA */
    .statue-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px 20px 22px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: radial-gradient(circle at center, rgba(16, 44, 68, 0.9), rgba(7, 18, 30, 0.96));
      box-shadow: 0 20px 50px rgba(0,0,0,0.4), inset 0 0 30px rgba(0,0,0,0.5);
      margin-bottom: 22px;
      position: relative;
    }

    /* BADGE LOGO UFFICIALE */
    .logo-container {
      margin-bottom: 14px;
    }
    .statue-logo {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #2dd4bf;
      box-shadow: 0 0 25px rgba(45, 212, 191, 0.5), inset 0 0 15px rgba(0,0,0,0.8);
      background: #020b14;
      display: block;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .statue-stage.powered-on .statue-logo {
      animation: logoPulse 4s infinite alternate ease-in-out;
    }
    @keyframes logoPulse {
      0% { transform: scale(1); box-shadow: 0 0 22px rgba(45, 212, 191, 0.5); }
      100% { transform: scale(1.03); box-shadow: 0 0 35px rgba(45, 212, 191, 0.8), 0 0 70px rgba(56, 189, 248, 0.3); }
    }

    /* SCRITTA NAVIGOTO LETTERA PER LETTERA */
    .navigoto-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 8px 0 14px;
      user-select: none;
    }
    .nav-let {
      font-family: 'Manrope', 'DM Sans', sans-serif;
      font-size: 56px;
      font-weight: 900;
      letter-spacing: 0.04em;
      display: inline-block;
      transition: color 0.3s ease, text-shadow 0.3s ease;
      color: #334155;
      text-shadow: none;
    }
    @media (max-width: 600px) {
      .nav-let { font-size: 38px; gap: 4px; }
      .statue-logo { width: 85px; height: 85px; }
    }

    .statue-stage.powered-off .nav-let {
      color: #1e293b !important;
      text-shadow: 0 1px 2px rgba(255,255,255,0.05) !important;
    }

    .statue-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(15, 34, 50, 0.8);
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
    }
    .statue-status-pill.on {
      border-color: #059669;
      color: #a7f3d0;
      background: rgba(16, 185, 129, 0.12);
    }

    /* CONTROLLI PRINCIPALI: ON/OFF & LUMINOSITÀ */
    .main-controls-card {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 24px;
      padding: 20px 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(13, 26, 41, 0.95);
      box-shadow: 0 12px 36px rgba(0,0,0,0.25);
      margin-bottom: 22px;
    }
    @media (max-width: 700px) {
      .main-controls-card { grid-template-columns: 1fr; gap: 16px; }
    }

    .btn-power-main {
      padding: 14px 34px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 2px solid transparent;
      transition: all 0.25s;
    }
    .btn-power-main.on {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #022c22;
      border-color: #34d399;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.45);
    }
    .btn-power-main.off {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
      border-color: #f87171;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.35);
    }
    .btn-power-main:hover {
      transform: translateY(-2px);
    }

    .brightness-slider-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
    }
    .slider-labels b {
      color: var(--accent);
      font-size: 15px;
    }
    .range-input {
      width: 100%;
      height: 10px;
      border-radius: 5px;
      background: #06121d;
      outline: none;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* CARD EFFETTI LUMINOSI */
    .effects-section {
      padding: 22px 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(13, 26, 41, 0.95);
      box-shadow: 0 12px 36px rgba(0,0,0,0.25);
      margin-bottom: 22px;
    }
    .effects-section h2 {
      margin: 0 0 6px;
      font-size: 20px;
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
    }
    .effects-section p.sub {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
    }
    .effects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }
    .btn-effect {
      background: #091522;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 10px;
      text-align: center;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      position: relative;
      user-select: none;
    }
    .btn-effect span.ico {
      font-size: 28px;
      line-height: 1;
    }
    .btn-effect:hover {
      border-color: var(--accent);
      background: #11283d;
      transform: translateY(-2px);
    }
    .btn-effect.active {
      border-color: var(--accent);
      background: rgba(45, 212, 191, 0.16);
      color: #a7fff0;
      box-shadow: 0 0 20px rgba(45, 212, 191, 0.3);
    }
    .btn-effect small.hint {
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
      margin-top: 2px;
    }

    /* CARD CONTATORE MONETE ARCADE */
    .coin-arcade-card {
      padding: 26px 20px;
      border: 1px solid #366d7c;
      border-radius: 20px;
      background: radial-gradient(circle at center, rgba(16, 47, 58, 0.95), rgba(7, 27, 36, 0.95));
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.3);
    }
    .arcade-box {
      background: #030d12;
      border: 2px solid #28515d;
      border-radius: 18px;
      padding: 20px 20px;
      max-width: 440px;
      margin: 0 auto 18px;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 25px rgba(245, 158, 11, 0.2);
      transition: all 0.3s;
    }
    .arcade-box.coin-pulse {
      animation: goldGlow 0.8s ease-out;
    }
    @keyframes goldGlow {
      0% { box-shadow: inset 0 0 40px rgba(245,158,11,0.8), 0 0 50px rgba(245,158,11,0.7); border-color: #f59e0b; }
      100% { box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 25px rgba(245,158,11,0.2); border-color: #28515d; }
    }
    .arcade-title {
      font-size: 11px;
      letter-spacing: 0.25em;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .arcade-number {
      font-family: 'Press Start 2P', monospace;
      font-size: 46px;
      color: #fbbf24;
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.6), 0 0 30px rgba(245, 158, 11, 0.4);
      margin: 8px 0;
    }
    .arcade-sub {
      font-size: 12px;
      color: var(--accent);
      font-weight: 700;
    }
    .coin-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-coin-sim {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: 1px solid #fbbf24;
      color: #1e1302;
      font-weight: 900;
      padding: 13px 26px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.35);
      transition: all 0.2s;
    }
    .btn-coin-sim:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.55);
    }
    .btn-reset-coins {
      background: #15222d;
      border: 1px solid #334e63;
      color: #94a3b8;
      font-weight: 800;
      padding: 13px 20px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-reset-coins:hover {
      background: #2a151b;
      border-color: #fb7185;
      color: #fca5a5;
    }

    @media (max-width: 820px) {
      main {
        margin-left: 0;
        padding: 20px 14px 100px;
      }
    }
  </style>
</head>
<body class="navigoto-page">
  <!-- BOTTONE HAMBURGER NAVISUITE IN ALTO A DESTRA -->
  <button type="button" id="navigoto-menu-btn" aria-label="Apri menu NaviSuite" title="Apri menu">
    <span>☰</span>
  </button>

  <aside class="app-sidebar" id="admin-sidebar"></aside>

  <main>
    <!-- HERO STATUA CON LOGO E SCRITTA NAVIGOTO COLORATA -->
    <section class="statue-stage powered-on" id="statueStage">
      <div class="logo-container">
        <img src="assets/images/navigoto-badge.png" alt="Logo Navigoto" class="statue-logo" id="statueLogo">
      </div>

      <!-- Scritta NAVIGOTO dinamica con lettere a colori che replicano i LED della statua -->
      <div class="navigoto-title" id="navigotoWord" aria-label="NAVIGOTO">
        <span class="nav-let" data-i="0">N</span>
        <span class="nav-let" data-i="1">A</span>
        <span class="nav-let" data-i="2">V</span>
        <span class="nav-let" data-i="3">I</span>
        <span class="nav-let" data-i="4">G</span>
        <span class="nav-let" data-i="5">O</span>
        <span class="nav-let" data-i="6">T</span>
        <span class="nav-let" data-i="7">O</span>
      </div>

      <div class="statue-status-pill on" id="statueStatusPill">
        <span>✨</span> <span id="currentEffectLabel">Effetto: Lettere a Colori</span>
      </div>
    </section>

    <!-- ACCENSIONE & LUMINOSITÀ -->
    <section class="main-controls-card">
      <div>
        <button type="button" class="btn-power-main on" id="btnPowerMain">
          <span id="powerIco">⚡</span> <span id="powerText">ACCESO</span>
        </button>
      </div>
      <div class="brightness-slider-wrap">
        <div class="slider-labels">
          <span>Luminosità LED</span>
          <b id="brightPercent">70%</b>
        </div>
        <input type="range" class="range-input" id="brightSlider" min="10" max="255" value="180">
      </div>
    </section>

    <!-- SELETTORE EFFETTI LUMINOSI (INCLUSO IL PULSANTE COLORE PERSONALIZZATO) -->
    <section class="effects-section">
      <h2>Effetti Luminosi</h2>
      <p class="sub">Tocca un effetto per attivarlo sulla statua. Sul colore puoi tenere premuto per cambiarlo.</p>

      <div class="effects-grid">
        <button type="button" class="btn-effect" data-effect="0">
          <span class="ico">🌈</span>
          <span>Arcobaleno</span>
        </button>
        <button type="button" class="btn-effect" data-effect="1">
          <span class="ico">🪙</span>
          <span>Coin Chaser</span>
        </button>
        <button type="button" class="btn-effect" data-effect="2">
          <span class="ico">✨</span>
          <span>Oro Pulsante</span>
        </button>
        <button type="button" class="btn-effect" data-effect="3">
          <span class="ico">🌆</span>
          <span>Cyberpunk</span>
        </button>
        <button type="button" class="btn-effect active" data-effect="5">
          <span class="ico">🔤</span>
          <span>Lettere NAVI</span>
        </button>
        <button type="button" class="btn-effect" data-effect="6">
          <span class="ico">🎆</span>
          <span>Fireworks</span>
        </button>
        
        <!-- PULSANTE COLORE PERSONALIZZATO (CLICK: ATTIVA | LONG PRESS: CAMBIA) -->
        <button type="button" class="btn-effect" data-effect="4" id="btnCustomColor">
          <span class="ico" id="customColorDot" style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#c1170b;box-shadow:0 0 10px #c1170b;border:2px solid rgba(255,255,255,0.4)"></span>
          <span>Tinta Unita</span>
          <small class="hint">Tieni premuto 🎨</small>
        </button>
      </div>

      <!-- Color picker nascosto azionato dal pulsante -->
      <input type="color" id="hiddenColorPicker" style="position:absolute;opacity:0;pointer-events:none;left:-9999px" value="#c1170b">
    </section>

    <!-- CONTATORE MONETE ARCADE -->
    <section class="coin-arcade-card">
      <div class="arcade-box" id="arcadeBox">
        <div class="arcade-title">Totale Monete Rilevate</div>
        <div class="arcade-number" id="coinCounter">---</div>
        <div class="arcade-sub">Sincronizzazione in tempo reale via Cloud</div>
      </div>
      <div class="coin-actions">
        <button type="button" class="btn-coin-sim" id="btnSimCoin">
          <span>✨</span> Simula Passaggio Moneta
        </button>
        <button type="button" class="btn-reset-coins" id="btnResetCoins">
          Azzera Contatore
        </button>
      </div>
    </section>
  </main>

  <!-- SCRIPT DI SISTEMA NAVISUITE & FIREBASE -->
  <script src="assets/js/shared-roles.js?v=5"></script>
  <script src="assets/js/shared-menu.js?v=5"></script>
  <script src="assets/js/admin-firebase-rest.js?v=5"></script>

  <script>
    (function() {
      // 1. Apertura Menu Hamburger
      const menuBtn = document.getElementById('navigoto-menu-btn');
      menuBtn?.addEventListener('click', () => {
        if (window.NaviSuiteMenu?.open) window.NaviSuiteMenu.open();
        else if (window.SharedMenu?.open) window.SharedMenu.open();
      });

      if (window.SharedMenu?.init) {
        window.SharedMenu.init('navigoto.html');
      }

      // 2. Elementi UI
      const statueStage = document.getElementById('statueStage');
      const letterSpans = document.querySelectorAll('.nav-let');
      const currentEffectLabel = document.getElementById('currentEffectLabel');
      const statueStatusPill = document.getElementById('statueStatusPill');
      const btnPowerMain = document.getElementById('btnPowerMain');
      const powerText = document.getElementById('powerText');
      const brightSlider = document.getElementById('brightSlider');
      const brightPercent = document.getElementById('brightPercent');
      const effectBtns = document.querySelectorAll('.btn-effect');
      const btnCustomColor = document.getElementById('btnCustomColor');
      const customColorDot = document.getElementById('customColorDot');
      const hiddenColorPicker = document.getElementById('hiddenColorPicker');
      const coinCounter = document.getElementById('coinCounter');
      const arcadeBox = document.getElementById('arcadeBox');

      let currentPower = true;
      let currentEffect = 5;
      let currentBrightness = 180;
      let currentCustomColor = '#c1170b';
      let lastCoinCount = -1;
      let animFrameId = null;

      const DEFAULT_LETTER_COLORS = [
        '#00d2ff', // N: Ciano
        '#ff003c', // A: Rosso
        '#00e676', // V: Verde
        '#9d00ff', // I: Viola
        '#76ff03', // G: Lime
        '#0066ff', // O: Blu
        '#ff6d00', // T: Arancio
        '#e040fb'  // O: Fucsia
      ];
      let activeLetterColors = [...DEFAULT_LETTER_COLORS];

      // 3. MOTORE VISIVO: ANIMAZIONE DELLE LETTERE NAVIGOTO
      let animTick = 0;
      function animateLetters() {
        animTick++;

        if (!currentPower) {
          letterSpans.forEach(el => {
            el.style.color = '#1e293b';
            el.style.textShadow = 'none';
          });
          animFrameId = requestAnimationFrame(animateLetters);
          return;
        }

        // 0: Arcobaleno Fluido
        if (currentEffect === 0) {
          letterSpans.forEach((el, i) => {
            const hue = (animTick * 2 + i * 45) % 360;
            const col = `hsl(${hue}, 100%, 55%)`;
            el.style.color = col;
            el.style.textShadow = `0 0 14px ${col}, 0 0 28px ${col}`;
          });
        }
        // 1: Coin Chaser
        else if (currentEffect === 1) {
          const activeIdx = Math.floor(animTick / 10) % 8;
          letterSpans.forEach((el, i) => {
            if (i === activeIdx) {
              el.style.color = '#ffffff';
              el.style.textShadow = '0 0 20px #ffffff, 0 0 35px #f59e0b';
            } else if (i === (activeIdx - 1 + 8) % 8) {
              el.style.color = '#f59e0b';
              el.style.textShadow = '0 0 15px #f59e0b';
            } else {
              el.style.color = '#1e3a5f';
              el.style.textShadow = 'none';
            }
          });
        }
        // 2: Oro Pulsante
        else if (currentEffect === 2) {
          const breath = (Math.sin(animTick * 0.05) + 1) / 2;
          const light = Math.round(45 + breath * 25);
          const col = `hsl(42, 100%, ${light}%)`;
          letterSpans.forEach(el => {
            el.style.color = col;
            el.style.textShadow = `0 0 ${12 + breath * 16}px #f59e0b, 0 0 ${25 + breath * 20}px #d97706`;
          });
        }
        // 3: Cyberpunk Neon
        else if (currentEffect === 3) {
          letterSpans.forEach((el, i) => {
            const isPink = (i % 2 === 0);
            const col = isPink ? '#ec4899' : '#06b6d4';
            el.style.color = col;
            el.style.textShadow = `0 0 15px ${col}, 0 0 30px ${col}`;
          });
        }
        // 4: Colore Personalizzato
        else if (currentEffect === 4) {
          const col = currentCustomColor;
          letterSpans.forEach(el => {
            el.style.color = col;
            el.style.textShadow = `0 0 16px ${col}, 0 0 32px ${col}`;
          });
        }
        // 5: Lettere NAVI a Colori
        else if (currentEffect === 5) {
          letterSpans.forEach((el, i) => {
            const col = activeLetterColors[i] || DEFAULT_LETTER_COLORS[i % 8];
            el.style.color = col;
            el.style.textShadow = `0 0 15px ${col}, 0 0 30px ${col}`;
          });
        }
        // 6: Fireworks Party
        else if (currentEffect === 6) {
          letterSpans.forEach(el => {
            if (Math.random() < 0.3) {
              const hue = Math.floor(Math.random() * 360);
              const col = `hsl(${hue}, 100%, 65%)`;
              el.style.color = col;
              el.style.textShadow = `0 0 20px #fff, 0 0 40px ${col}`;
            }
          });
        }

        animFrameId = requestAnimationFrame(animateLetters);
      }
      animFrameId = requestAnimationFrame(animateLetters);

      // 4. CONFIGURAZIONE CLOUD FIREBASE
      const API_KEY = "AIzaSyBfJZWHjr3AIANDBj2p8uQ0_hbcHdmnSiE";
      const DATABASE_URL = "https://navisuite-f116f-default-rtdb.europe-west1.firebasedatabase.app";
      const PATH = "/private/adminUpdates/navigoto.json";

      let idToken = null;
      let tokenExpiresAt = 0;

      async function getAuthToken() {
        if (idToken && Date.now() < tokenExpiresAt - 60000) return idToken;
        try {
          if (window.NaviAdminFirebase?.ensureAuth) {
            const auth = await window.NaviAdminFirebase.ensureAuth();
            if (auth?.idToken) {
              idToken = auth.idToken;
              tokenExpiresAt = auth.expiresAt || (Date.now() + 3600000);
              return idToken;
            }
          }
        } catch (_) {}

        const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${encodeURIComponent(API_KEY)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ returnSecureToken: true })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error?.message || "Auth fallita");
        idToken = data.idToken;
        tokenExpiresAt = Date.now() + (Number(data.expiresIn || 3600) * 1000);
        return idToken;
      }

      async function sendCloudUpdate(patchObj) {
        try {
          const token = await getAuthToken();
          patchObj.updated_at = Date.now();
          await fetch(`${DATABASE_URL}${PATH}?auth=${encodeURIComponent(token)}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(patchObj)
          });
        } catch (e) {
          console.warn('Errore sync Firebase:', e);
        }
      }

      const EFFECT_NAMES = {
        0: 'Arcobaleno Fluido',
        1: 'Coin Chaser',
        2: 'Oro & Ambra Pulsante',
        3: 'Cyberpunk Neon',
        4: 'Colore Personalizzato',
        5: 'Lettere a Colori',
        6: 'Fireworks Party'
      };

      function updateCustomColorDisplay(hex) {
        currentCustomColor = hex;
        hiddenColorPicker.value = hex;
        if (customColorDot) {
          customColorDot.style.background = hex;
          customColorDot.style.boxShadow = `0 0 12px ${hex}`;
        }
      }

      function applyCloudState(data) {
        if (!data) return;

        // Power
        if (data.power !== undefined) {
          currentPower = Boolean(data.power);
          btnPowerMain.className = `btn-power-main ${currentPower ? 'on' : 'off'}`;
          powerText.textContent = currentPower ? 'ACCESO' : 'SPENTO';
          statueStage.className = `statue-stage ${currentPower ? 'powered-on' : 'powered-off'}`;
          statueStatusPill.className = `statue-status-pill ${currentPower ? 'on' : 'off'}`;
        }

        // Effetto
        if (data.effect !== undefined) {
          currentEffect = Number(data.effect);
          effectBtns.forEach(btn => {
            btn.classList.toggle('active', Number(btn.dataset.effect) === currentEffect);
          });
          currentEffectLabel.textContent = `Effetto: ${EFFECT_NAMES[currentEffect] || 'Personalizzato'}`;
        }

        // Luminosità
        if (data.brightness !== undefined && !isInteractingBright) {
          currentBrightness = Number(data.brightness);
          brightSlider.value = currentBrightness;
          brightPercent.textContent = Math.round((currentBrightness / 255) * 100) + '%';
        }

        // Colore personalizzato
        if (data.custom_hex) {
          updateCustomColorDisplay(data.custom_hex);
        }

        // Monete
        if (data.coins !== undefined) {
          coinCounter.textContent = data.coins;
          if (lastCoinCount !== -1 && data.coins > lastCoinCount) {
            arcadeBox.classList.remove('coin-pulse');
            void arcadeBox.offsetWidth;
            arcadeBox.classList.add('coin-pulse');
          }
          lastCoinCount = data.coins;
        }
      }

      async function pollCloud() {
        try {
          const token = await getAuthToken();
          const res = await fetch(`${DATABASE_URL}${PATH}?auth=${encodeURIComponent(token)}`);
          if (res.ok) {
            const data = await res.json();
            applyCloudState(data);
          }
        } catch (e) {
          console.warn('Polling fallito:', e);
        }
      }

      // 5. INTERAZIONI CONTROLLO UTENTE
      // Power ON / OFF
      btnPowerMain.addEventListener('click', () => {
        const nextPower = !currentPower;
        currentPower = nextPower;
        btnPowerMain.className = `btn-power-main ${nextPower ? 'on' : 'off'}`;
        powerText.textContent = nextPower ? 'ACCESO' : 'SPENTO';
        statueStage.className = `statue-stage ${nextPower ? 'powered-on' : 'powered-off'}`;
        statueStatusPill.className = `statue-status-pill ${nextPower ? 'on' : 'off'}`;
        sendCloudUpdate({ power: nextPower });
      });

      // Slider Luminosità
      let isInteractingBright = false;
      brightSlider.addEventListener('input', () => {
        isInteractingBright = true;
        brightPercent.textContent = Math.round((brightSlider.value / 255) * 100) + '%';
      });
      brightSlider.addEventListener('change', () => {
        isInteractingBright = false;
        currentBrightness = Number(brightSlider.value);
        sendCloudUpdate({ brightness: currentBrightness });
      });

      // Pulsanti Effetti Standard
      effectBtns.forEach(btn => {
        if (btn.id === 'btnCustomColor') return; // Gestito a parte con click e long-press!

        btn.addEventListener('click', () => {
          const effId = Number(btn.dataset.effect);
          effectBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentEffect = effId;
          currentEffectLabel.textContent = `Effetto: ${EFFECT_NAMES[currentEffect] || 'Personalizzato'}`;
          currentPower = true;
          statueStage.className = 'statue-stage powered-on';
          btnPowerMain.className = 'btn-power-main on';
          powerText.textContent = 'ACCESO';
          sendCloudUpdate({ effect: effId, power: true });
        });
      });

      // GESTIONE PULSANTE COLORE PERSONALIZZATO:
      // Click rapido = attiva effetto 4
      // Pressione prolungata (> 500ms) = apre il selettore colore per cambiarlo
      let longPressTimer = null;
      let isLongPressTriggered = false;

      function triggerColorPicker() {
        isLongPressTriggered = true;
        navigator.vibrate?.(50);
        hiddenColorPicker.click();
      }

      btnCustomColor.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return; // solo tasto sinistro / tocco
        isLongPressTriggered = false;
        longPressTimer = setTimeout(triggerColorPicker, 500);
      });

      const cancelPress = () => {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      };

      btnCustomColor.addEventListener('pointerup', cancelPress);
      btnCustomColor.addEventListener('pointerleave', cancelPress);
      btnCustomColor.addEventListener('pointercancel', cancelPress);

      btnCustomColor.addEventListener('click', () => {
        if (isLongPressTriggered) {
          isLongPressTriggered = false;
          return;
        }
        // Click normale: attiva subito l'effetto Tinta Unita
        effectBtns.forEach(b => b.classList.remove('active'));
        btnCustomColor.classList.add('active');
        currentEffect = 4;
        currentEffectLabel.textContent = 'Effetto: Colore Personalizzato';
        currentPower = true;
        statueStage.className = 'statue-stage powered-on';
        btnPowerMain.className = 'btn-power-main on';
        powerText.textContent = 'ACCESO';
        sendCloudUpdate({ effect: 4, power: true });
      });

      // Doppio click su desktop apre anche la palette comodamente
      btnCustomColor.addEventListener('dblclick', triggerColorPicker);

      // Quando l'utente sceglie un nuovo colore dalla palette
      hiddenColorPicker.addEventListener('change', () => {
        const newColor = hiddenColorPicker.value;
        updateCustomColorDisplay(newColor);
        effectBtns.forEach(b => b.classList.remove('active'));
        btnCustomColor.classList.add('active');
        currentEffect = 4;
        currentEffectLabel.textContent = 'Effetto: Colore Personalizzato';
        currentPower = true;
        statueStage.className = 'statue-stage powered-on';
        btnPowerMain.className = 'btn-power-main on';
        powerText.textContent = 'ACCESO';
        sendCloudUpdate({ custom_hex: newColor, effect: 4, power: true });
      });

      // Simula Moneta
      document.getElementById('btnSimCoin').addEventListener('click', () => {
        arcadeBox.classList.remove('coin-pulse');
        void arcadeBox.offsetWidth;
        arcadeBox.classList.add('coin-pulse');
        const current = Number(coinCounter.textContent) || 0;
        sendCloudUpdate({
          trigger_coin: Date.now(),
          coins: current + 1
        });
      });

      // Reset Monete
      document.getElementById('btnResetCoins').addEventListener('click', () => {
        if (!confirm('Vuoi azzerare il contatore monete sul Cloud e sulla scheda?')) return;
        coinCounter.textContent = '0';
        lastCoinCount = 0;
        sendCloudUpdate({ coins: 0 });
      });

      // Avvio
      pollCloud();
      setInterval(pollCloud, 2000);
    })();
  </script>
</body>
</html>
