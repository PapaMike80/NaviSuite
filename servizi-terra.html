<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NaviDiaria">
  <meta name="theme-color" content="#002b5e">
  <link rel="manifest" href="manifest.json">
  <link rel="shortcut icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/icona_apple_180.png">
  <title>NaviSuite Servizi a terra</title>
  <link rel="stylesheet" href="assets/css/navi-shared.css">
  <link rel="stylesheet" href="assets/css/shared-menu.css">
  <style>
    body.servizi-terra-page{min-height:100vh;background:var(--bg,#071820);color:var(--ink,#e8f7f7);font-family:"DM Sans",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .servizi-terra-page .page-header{position:relative;padding:20px 70px 16px 22px;border-bottom:1px solid rgba(45,212,191,.22);background:radial-gradient(520px 220px at 12% -30%,rgba(45,212,191,.10),transparent 60%),rgba(11,28,38,.94)}
    .terra-label{margin:0 0 4px;color:#2dd4bf;font-size:12px;font-weight:800;letter-spacing:.2em}
    .terra-title{margin:0;font:800 26px/1.1 Manrope,system-ui,sans-serif}
    .terra-context{margin:5px 0 0;color:#9bc8d5;font-size:13px}
    .terra-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;max-width:900px;margin:14px auto 0;padding:0 14px}
    /* Stessi pulsantini tondi delle residenze di NaviTurni (naviturni-page.css) */
    .quick-residence-selector{display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px}
    .quick-residence-btn{display:grid;place-items:center;width:34px;height:34px;padding:0;border:1px solid var(--quick-res-color);border-radius:999px;background:color-mix(in srgb,var(--quick-res-color) 17%,#0c2934);color:color-mix(in srgb,var(--quick-res-color) 88%,#f3ffff);font:900 13px/1 Manrope,sans-serif;cursor:pointer;touch-action:manipulation}
    .quick-residence-btn:hover,.quick-residence-btn:focus-visible{outline:none;filter:brightness(1.18)}
    .quick-residence-btn.active{background:color-mix(in srgb,var(--quick-res-color) 58%,#0c2934);border-color:var(--quick-res-color);color:#fff;box-shadow:0 0 0 2px color-mix(in srgb,var(--quick-res-color) 30%,transparent),0 3px 10px color-mix(in srgb,var(--quick-res-color) 36%,transparent)}
    .quick-residence-btn[data-res="DESENZANO"]{--quick-res-color:#24b7f2}.quick-residence-btn[data-res="MADERNO"]{--quick-res-color:#f59e0b}
    .terra-week{display:flex;align-items:center;gap:6px}
    .terra-week[hidden]{display:none}
    .terra-week button,.terra-print{min-height:34px;padding:0 12px;border:1px solid #2d6570;border-radius:10px;background:#12313b;color:#dffcff;font:800 13px DM Sans,sans-serif;cursor:pointer}
    .terra-week button{width:34px;padding:0;font-size:18px}
    .terra-week span{min-width:118px;color:#e8f7f7;font-weight:800;font-size:13px;text-align:center}
    .terra-print{margin-left:auto;border-color:#2dd4bf;color:#a7fff0}
    .terra-notice{max-width:900px;margin:12px auto 0;padding:10px 14px;border:1px solid #90641f;border-radius:12px;background:#2c2415;color:#ffd48a;font-size:13px;box-sizing:border-box}
    .terra-notice[hidden]{display:none}
    .terra-sheet{display:block;width:100%;max-width:900px;height:1200px;margin:12px auto 24px;border:0;border-radius:10px;background:#d8dde2}
    @media(max-width:520px){
      .servizi-terra-page .page-header{padding:16px 66px 14px 16px}
      .terra-title{font-size:23px}
      .terra-bar{gap:9px;padding:0 10px}
      .terra-print{margin-left:0}
      .terra-sheet{border-radius:0}
    }
  </style>
</head>
<body class="servizi-terra-page">
  <aside class="app-sidebar" id="terra-sidebar"></aside>

  <header class="page-header">
    <p class="terra-label">SERVIZI A TERRA</p>
    <h1 class="terra-title" id="terra-title">Servizi a terra</h1>
    <p class="terra-context" id="terra-context">Caricamento…</p>
  </header>

  <main id="servizi-terra">
    <div class="terra-bar">
      <div class="quick-residence-selector" id="terra-residences" aria-label="Cambia residenza"></div>
      <div class="terra-week" id="terra-week" hidden>
        <button type="button" id="terra-prev" aria-label="Settimana precedente">‹</button>
        <span id="terra-week-label"></span>
        <button type="button" id="terra-next" aria-label="Settimana successiva">›</button>
      </div>
      <button type="button" class="terra-print" id="terra-print">Stampa / PDF</button>
    </div>
    <div class="terra-notice" id="terra-notice" hidden></div>
    <iframe class="terra-sheet" id="terra-sheet" title="Foglio A4 dei servizi a terra"></iframe>
  </main>

  <script src="assets/js/shared-roles.js?v=1"></script>
  <script src="assets/js/admin-firebase-rest.js?v=39"></script>
  <script src="assets/js/shared-menu.js?v=1.60"></script>
  <script src="assets/js/servizi-terra-a4.js?v=3"></script>
  <script src="assets/js/servizi-terra-page.js?v=1"></script>
</body>
</html>
