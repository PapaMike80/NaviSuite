<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NaviDiaria">
  <meta name="theme-color" content="#002b5e">
  <link rel="manifest" href="manifest.json">
  <link rel="shortcut icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/icona_apple_180.png">
  <title>NaviSuite Scali</title>
  <link rel="stylesheet" href="assets/css/navi-shared.css">
  <link rel="stylesheet" href="assets/css/shared-menu.css?v=2">
  <link rel="stylesheet" href="assets/css/servizi-terra.css?v=17">
  <link rel="stylesheet" href="assets/css/orario.css?v=33">
</head>
<body class="servizi-terra-page orario-page">
  <aside class="app-sidebar" id="orario-sidebar"></aside>

  <header class="page-header">
    <p class="terra-label">SCALI E NAVI</p>
    <h1 class="terra-title" id="orario-title">Scali</h1>
    <p class="terra-context" id="orario-context">Navi sul lago e allo scalo, con pontili, ormeggi e agenti di servizio</p>
  </header>

  <main id="orario">
    <div class="terra-bar">
      <span class="terra-day">
        <button type="button" class="terra-day-nav" id="orario-day-prev" aria-label="Giorno precedente">‹</button>
        <span class="terra-day-current"><span class="terra-day-label" id="orario-day-label"></span>
          <input type="date" class="terra-day-input" id="orario-day-input" aria-label="Scegli la giornata"></span>
        <button type="button" class="terra-day-nav" id="orario-day-next" aria-label="Giorno successivo">›</button>
        <button type="button" class="terra-day-today" id="orario-day-today" hidden>Oggi</button>
      </span>
      <nav class="or-tabs" id="orario-tabs" aria-label="Vista">
        <button type="button" data-view="lago">Lago</button>
        <button type="button" data-view="viaggio">Da → A</button>
      </nav>
      <a id="orario-stampa" href="stampa-partenze.html" title="Orario delle partenze dello scalo, da stampare" style="display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border:1px solid #1f4250;border-radius:10px;background:#102733;color:#9fb8c2;font:800 11px Manrope,system-ui,sans-serif;text-decoration:none;white-space:nowrap">🖨 A4</a>
    </div>
    <div class="terra-notice" id="orario-notice" hidden></div>
    <div id="orario-content"></div>
  </main>

  <script src="assets/js/shared-roles.js?v=8"></script>
  <script src="assets/js/admin-firebase-rest.js?v=84"></script>
  <script src="assets/js/shared-data.js?v=137"></script>
  <script src="assets/js/firebase-auth.js?v=2"></script>
  <script src="assets/js/shared-menu.js?v=1.78"></script>
  <script src="assets/js/offline.js?v=2"></script>
  <script src="assets/js/course-info.js?v=1"></script>
  <script src="assets/js/turni-giorno.js?v=8"></script>
  <script src="assets/js/servizi-terra-a4.js?v=21"></script>
  <script src="assets/js/orario-corse.js?v=1"></script>
  <script src="assets/js/orario-giorno.js?v=6"></script>
  <script src="assets/js/orario-lago.js?v=2"></script>
  <script src="assets/js/orario-page.js?v=67"></script>
  <script src="assets/js/push-arrivi.js?v=9"></script>
  <script src="assets/js/arrivi-avvisi.js?v=1"></script>
  <script>
  // Partenze A4: stesso scalo e giorno della pagina
  document.getElementById('orario-stampa')?.addEventListener('click', e => {
    const q = new URLSearchParams(location.search), day = document.getElementById('orario-day-input')?.value || '';
    const u = new URLSearchParams(); if (q.get('scalo')) u.set('scalo', q.get('scalo')); if (day) u.set('data', day);
    e.currentTarget.href = 'stampa-partenze.html' + (u.toString() ? '?' + u : '');
  });
  </script>
</body>
</html>
